name: projekt7 Lead-Pipeline

on:
  schedule:
    # Jeden Montag um 05:00 UTC (06:00 Zürich im Winter, 07:00 im Sommer)
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run ausführen (nichts schreiben, nichts senden)'
        required: false
        type: boolean
        default: false
      max_kandidaten:
        description: 'Maximale Anzahl neuer Firmen aus der Websuche (0 = nur Import bewerten)'
        required: false
        type: number
        default: 40
      max_import:
        description: 'Maximale Anzahl importierter Adressen, die bewertet werden'
        required: false
        type: number
        default: 60

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: projekt7 Pipeline ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          WEB_PROVIDER: claude
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_ACCESS: ${{ vars.BLOB_ACCESS || 'private' }}
          ANTHROPIC_MODEL: claude-sonnet-4-5-20250929
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_CC: ${{ secrets.DIGEST_CC }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Zeitplan-Läufe: Standardwerte. Manuelle Läufe: Werte aus dem Formular.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          MAX_KANDIDATEN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_kandidaten || '40' }}
          MAX_IMPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_import || '60' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::GitHub-Secret ANTHROPIC_API_KEY fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ARGS="--max-kandidaten $MAX_KANDIDATEN --max-import $MAX_IMPORT --summary-file $GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Starte Pipeline mit: $ARGS"
          python -m p7_akquise.pipeline $ARGS 2>&1 | tee pipeline.log

      - name: Ergebnisse als Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projekt7-lauf-${{ github.run_number }}
          path: |
            pipeline.log
            data/projekt7_Leads.xlsx
            /tmp/projekt7_Leads.xlsx
          if-no-files-found: ignore
          retention-days: 14
